services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    command: ["sh", "-c", "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi && apache2-foreground"]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vite_gourmand
      MYSQL_USER: vite
      MYSQL_PASSWORD: vite
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"